# Public catalog API: https://docs.openclaw.ai/clawhub/http-api
# Keep the existing source/registry identity; replace the unreachable .dev scraper.
name: clawhub
kind: api
hosts:
  - clawhub.ai
cadence_cron: "15 5 * * *"
rate_limit_per_second: 1.0
queue: ingest_aggregator
enabled: true
registry_id: clawhub
discovery:
  api_base: https://clawhub.ai
  page_limit: 50
  max_pages: 10
  max_items: 150
description: Resumably reads public ClawHub skills through the documented catalog API, crediting each listing.
policy:
  summary: >-
    ClawHub explicitly permits third-party directories to reuse its public read API.
    We cache responses, honor rate limits, credit canonical owner-qualified listings,
    and do not fetch hidden/private content, skill archives, or authenticated endpoints.
  contact: bot@saferskills.ai
  robots_txt: n/a (documented public API; no HTML scraping)
